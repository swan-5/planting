name: Planting
options:
  bundleIdPrefix: com.planting.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6ST84DG9D8

packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  Planting:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Planting
    resources:
      - path: Planting/Resources
    info:
      path: Planting/App/Info.plist
      properties:
        UILaunchScreen: {}
        UIAppFonts:
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
        CFBundleDisplayName: Planting
        # Lets Firebase Phone Auth's reCAPTCHA-verification web flow hand
        # control back to the app (used until a paid Developer account adds
        # APNs-based silent verification instead). Not the bundle ID — this
        # is Firebase's own "encoded app ID" scheme, reverse-derived from
        # GoogleService-Info.plist's GOOGLE_APP_ID
        # (1:720707709518:ios:3163d4fdc0a862d23ef11f here); confirmed via
        # the exact scheme FirebaseAuth's runtime error asked for.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - app-1-720707709518-ios-3163d4fdc0a862d23ef11f
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Planting uses Face ID to unlock locked memos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.planting.app
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: Planting/App/Planting.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.planting.app
    dependencies:
      - target: PlantingWidgets
        embed: true
      - package: FirebaseSDK
        product: FirebaseAuth
      - package: FirebaseSDK
        product: FirebaseFirestore

  PlantingWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: Planting/Core/Models
      - path: Planting/Core/Persistence
      - path: Planting/Core/Recurrence
      - path: Planting/Core/DesignSystem
      - path: Planting/Features/Calendar/CalendarMonthLayout.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Planting Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.planting.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: Widgets/PlantingWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.planting.app

schemes:
  Planting:
    build:
      targets:
        Planting: all
        PlantingWidgets: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
